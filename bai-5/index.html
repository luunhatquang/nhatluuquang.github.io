<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý người dùng - React CRUD</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { font-family: "Segoe UI", sans-serif; margin: 0; padding: 16px; color: #222; }
h1 { margin: 0 0 12px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar input { padding: 6px 8px; min-width: 220px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
th { background: #f4f4f4; }
button { padding: 4px 10px; cursor: pointer; margin-right: 4px; }
.btn-delete { color: #b00020; }
/* Modal Overlay */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.4);
  display: flex; justify-content: center; align-items: center;
  z-index: 999;
}
/* Modal Content */
.modal-content { background: #fff; padding: 16px; border-radius: 6px; width: 320px; max-width: 92vw; }
.modal-content label { display: block; margin-top: 8px; font-size: 13px; }
.modal-content input { width: 100%; box-sizing: border-box; padding: 5px 6px; }
.modal-actions { margin-top: 14px; text-align: right; }
.empty { padding: 12px 8px; color: #666; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ---------- SearchForm ----------
function SearchForm({ onChangeValue }) {
  return (
    <input
      type="text"
      placeholder="Tìm theo name, username"
      onChange={(e) => onChangeValue(e.target.value)}
    />
  );
}

// ---------- Form dùng chung cho Thêm / Sửa ----------
const FIELDS = [
  ["name", "Name"], ["username", "Username"], ["email", "Email"],
  ["street", "Street"], ["suite", "Suite"], ["city", "City"],
  ["phone", "Phone"], ["website", "Website"],
];
const ADDRESS_KEYS = ["street", "suite", "city"];

function UserForm({ title, data, onFieldChange, onSubmit, onCancel, submitText }) {
  return (
    <div className="modal-overlay">
      <div className="modal-content">
        <h4>{title}</h4>
        {FIELDS.map(([key, label]) => (
          <div key={key}>
            <label htmlFor={key}>{label}:</label>
            <input
              id={key}
              type="text"
              value={ADDRESS_KEYS.includes(key) ? data.address[key] : data[key]}
              onChange={onFieldChange}
            />
          </div>
        ))}
        <div className="modal-actions">
          <button onClick={onSubmit}>{submitText}</button>
          <button onClick={onCancel}>Hủy</button>
        </div>
      </div>
    </div>
  );
}

// ---------- AddUser ----------
const emptyUser = () => ({
  name: "", username: "", email: "",
  address: { street: "", suite: "", city: "" },
  phone: "", website: "",
});

function AddUser({ onAdd }) {
  const [adding, setAdding] = React.useState(false);
  const [user, setUser] = React.useState(emptyUser());

  const handleChange = (e) => {
    const { id, value } = e.target;
    if (ADDRESS_KEYS.includes(id)) {
      // Spread để sao chép cả đối tượng cha (address)
      setUser({ ...user, address: { ...user.address, [id]: value } });
    } else {
      setUser({ ...user, [id]: value });
    }
  };

  const handleAdd = () => {
    if (user.name.trim() === "" || user.username.trim() === "") {
      alert("Vui lòng nhập Name và Username!");
      return;
    }
    onAdd(user);
    setUser(emptyUser());
    setAdding(false);
  };

  const handleCancel = () => { setUser(emptyUser()); setAdding(false); };

  return (
    <div>
      <button onClick={() => setAdding(true)}>Thêm</button>
      {adding && (
        <UserForm
          title="Thêm người dùng"
          data={user}
          onFieldChange={handleChange}
          onSubmit={handleAdd}
          onCancel={handleCancel}
          submitText="Thêm"
        />
      )}
    </div>
  );
}

// ---------- ResultTable ----------
function ResultTable({ keyword, user, onAdded }) {
  const [users, setUsers] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [editing, setEditing] = React.useState(null);

  // Tải dữ liệu 1 lần khi component mount
  React.useEffect(() => {
    fetch("https://jsonplaceholder.typicode.com/users")
      .then((res) => res.json())
      .then((data) => { setUsers(data); setLoading(false); })
      .catch(() => { setError("Không tải được dữ liệu từ API."); setLoading(false); });
  }, []);

  // Lắng nghe người dùng mới từ AddUser (qua App)
  React.useEffect(() => {
    if (user) {
      setUsers((prev) => {
        const nextId = prev.reduce((m, u) => Math.max(m, u.id), 0) + 1;
        return [...prev, { ...user, id: nextId }];
      });
      onAdded();
    }
  }, [user]);

  // Lọc theo keyword
  const kw = keyword.toLowerCase();
  const filteredUsers = users.filter(
    (u) => u.name.toLowerCase().includes(kw) || u.username.toLowerCase().includes(kw)
  );

  // Sửa: deep copy user + address vào state editing
  function editUser(u) {
    setEditing({ ...u, address: { ...u.address } });
  }

  function handleEditChange(e) {
    const { id, value } = e.target;
    if (ADDRESS_KEYS.includes(id)) {
      setEditing({ ...editing, address: { ...editing.address, [id]: value } });
    } else {
      setEditing({ ...editing, [id]: value });
    }
  }

  function saveUser() {
    if (editing.name.trim() === "" || editing.username.trim() === "") {
      alert("Vui lòng nhập Name và Username!");
      return;
    }
    setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
    setEditing(null);
  }

  // Xóa: filter tạo mảng mới, không cần xác nhận
  function removeUser(id) {
    setUsers((prev) => prev.filter((u) => u.id !== id));
  }

  if (loading) return <p>Đang tải...</p>;
  if (error) return <p>{error}</p>;

  return (
    <div className="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Họ tên</th><th>Username</th><th>Email</th>
            <th>Địa chỉ</th><th>Số điện thoại</th><th></th>
          </tr>
        </thead>
        <tbody>
          {filteredUsers.map((u) => (
            <tr key={u.id}>
              <td>{u.id}</td>
              <td>{u.name}</td>
              <td>{u.username}</td>
              <td>{u.email}</td>
              <td>{u.address.street}, {u.address.suite}, {u.address.city}</td>
              <td>{u.phone}</td>
              <td>
                <button onClick={() => editUser(u)}>Sửa</button>
                <button className="btn-delete" onClick={() => removeUser(u.id)}>Xóa</button>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {filteredUsers.length === 0 && <div className="empty">Không có người dùng phù hợp.</div>}
      {editing && (
        <UserForm
          title="Sửa người dùng"
          data={editing}
          onFieldChange={handleEditChange}
          onSubmit={saveUser}
          onCancel={() => setEditing(null)}
          submitText="Lưu"
        />
      )}
    </div>
  );
}

// ---------- App: giữ state, truyền props xuống con ----------
function App() {
  const [kw, setKeyword] = React.useState("");
  const [newUser, setNewUser] = React.useState(null);
  return (
    <div>
      <h1>Quản lý người dùng</h1>
      <div className="toolbar">
        <SearchForm onChangeValue={setKeyword} />
        <AddUser onAdd={setNewUser} />
      </div>
      <ResultTable keyword={kw} user={newUser} onAdded={() => setNewUser(null)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
