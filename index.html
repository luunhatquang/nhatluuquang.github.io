<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hai bài tìm và sửa lỗi CSS</title>
<style>
:root { --bg:#f4f1ea; --ink:#2b2b2b; --accent:#c0392b; --line:#d4cabc; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI",sans-serif; line-height:1.6; }
main { max-width:880px; margin:0 auto; padding:80px 24px; }
h1 { font-family:Georgia,serif; font-size:clamp(32px,6vw,56px); line-height:1.15; margin:0 0 24px; }
p { margin:0 0 40px; font-size:18px; }
nav { border-top:1px solid var(--line); }
nav a { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:28px 0; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; font-size:24px; }
nav a span { display:block; font-size:16px; margin-top:4px; }
nav a:hover { color:var(--accent); }
a:focus-visible { outline:3px solid var(--accent); outline-offset:6px; }
footer { margin-top:40px; font-size:16px; }
footer a { color:var(--accent); }
@media(max-width:640px) { main { padding-top:48px; } nav a { font-size:22px; } }
</style>
</head>
<body>
<main>
<h1>Tìm và sửa lỗi CSS</h1>
<p>Hai bài thực hành về box model và position. Chọn bài để xem giao diện đã sửa.</p>

</nav>
<footer><a href="https://github.com/luunhatquang/nhatluuquang.github.io">Xem mã nguồn và giải thích trên GitHub</a></footer>
</main>
</body>
</html>
